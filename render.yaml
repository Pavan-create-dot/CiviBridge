# Render service manifest — basic configuration for deploying the server
# Replace `repo` with your repository URL if you plan to use Render's YAML-managed services.

services:
  - type: web
    name: civibridge-server
    env: node
    plan: starter
    region: oregon
    repo: https://github.com/Pavan-create-dot/CiviBridge
    branch: main
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
