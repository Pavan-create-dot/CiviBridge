name: CiviBridge CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Check Node / npm versions
        run: |
          node -v
          npm -v

      - name: Fix package-lock.json registry URLs
        run: |
          sed -i 's|http://package-firewall.replit.local/npm/|https://registry.npmjs.org/|g' package-lock.json
          if [ -f server/package-lock.json ]; then
            sed -i 's|http://package-firewall.replit.local/npm/|https://registry.npmjs.org/|g' server/package-lock.json
          fi

      - name: Install Dependencies (workspaces; prefer optional platform binaries)
        # Strategy:
        #   1. Try plain `npm ci --workspaces` so Linux gets the correct Rollup native binary.
        #   2. If that fails (EBADPLATFORM / lockfile mismatch), fall back to --no-optional.
        #   3. On Linux, explicitly install @rollup/rollup-linux-x64-gnu in the client workspace
        #      as a safety net in case the lockfile still omits the optional entry.
        run: |
          set -e
          if npm ci --workspaces; then
            echo "✅ npm ci succeeded (optional deps included)"
          else
            echo "⚠️  npm ci failed — retrying with --no-optional"
            npm ci --workspaces --no-optional
          fi
          # Ensure the Linux-specific Rollup native binary is present for Vite/Rollup builds.
          if [ "$(uname -s)" = "Linux" ]; then
            if ! node -e "require('@rollup/rollup-linux-x64-gnu')" 2>/dev/null; then
              echo "🔧 Installing missing @rollup/rollup-linux-x64-gnu explicitly..."
              npm --workspace client install --no-save @rollup/rollup-linux-x64-gnu || true
            else
              echo "✅ @rollup/rollup-linux-x64-gnu already present"
            fi
          fi

      - name: Run Linting (client)
        run: npm --workspace client run lint

      - name: Run Linting (server)
        run: npm --workspace server run lint

      - name: Run Client Production Build
        # Confirms the React/Vite app compiles cleanly for deployment
        run: npm --workspace client run build

      - name: Run Server Integration Tests
        # Phase 8 Admin Triage API integration tests — requires a live DB connection.
        # Only runs when DATABASE_URL is configured as a GitHub Actions secret.
        if: ${{ env.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ADMIN_PROVISION_SECRET: ${{ secrets.ADMIN_PROVISION_SECRET }}
          DOTENV_PATH: '/dev/null'
        run: npm --workspace server run test
