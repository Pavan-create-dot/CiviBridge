name: CiviBridge CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Check Node / npm versions
        run: |
          node -v
          npm -v

      - name: Fix package-lock.json registry URLs
        run: sed -i 's|http://package-firewall.replit.local/npm/|https://registry.npmjs.org/|g' package-lock.json

      - name: Install Dependencies (workspaces)
        run: npm ci --workspaces

      - name: Run Linting
        run: npm --workspace client run lint && npm --workspace server run lint

      - name: Run Client Build
        run: npm --workspace client run build
